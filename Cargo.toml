[package]
name = "typst-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["multipart"] }
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
typst = "0.14.2"
typst-pdf = "0.14.2"
typst-kit = "0.14.2"
derive_typst_intoval = "0.6.0"
typst-as-lib = { version = "0.15.4", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
tower-http = { version = "0.6.8", features = ["limit", "trace"] }
serde_json = "1.0.149"
base64 = "0.22.1"

[[bin]]
name = "typst-server"
path = "src/main.rs"  # Specify the path to your main source file
